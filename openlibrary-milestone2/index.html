<!DOCTYPE html>
<html lang="en">
<head>
    <title>Book Search</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav><a href="index.html">Home</a> | <a href="bookshelf.html">My Bookshelf</a></nav>
    <h1>Book Search</h1>
    <p>A basic example of searching live Open Library data.</p>
    <form id="searchForm">
        <label for="searchTerm">Search for books:</label>
        <input id="searchTerm" value="data analysis">
        <button id="searchButton" type="submit">Search</button>
    </form>
    <p>
        <label for="pageNumber">Page:</label>
        <select id="pageNumber" disabled></select>
    </p>
    <p id="message" role="status"></p>
    <ul id="results"></ul>
    <script src="js/app.js"></script>
</body>
</html>
